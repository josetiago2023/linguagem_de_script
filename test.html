<!DOCTYPE html>
<html>
<body>

<h3>Cadastro de Produtos</h3>

<input type="text" id="nome" placeholder="Nome do produto">
<input type="text" id="fabricante" placeholder="Fabricante">

<select id="categoria">
    <option>Medicamento</option>
    <option>Higiene</option>
    <option>Cosmético</option>
</select>

<button onclick="salvarProduto()">Salvar</button>

<p id="resultado"></p>

<script>
function salvarProduto() {
    localStorage.setItem("nome", nome.value);
    localStorage.setItem("fabricante", fabricante.value);
    localStorage.setItem("categoria", categoria.value);

    mostrar();
}

function mostrar() {
    resultado.innerHTML =
        "Nome: " + localStorage.getItem("nome") + "<br>" +
        "Fabricante: " + localStorage.getItem("fabricante") + "<br>" +
        "Categoria: " + localStorage.getItem("categoria");
}

mostrar(); 
</script> 

</body>
</html>
