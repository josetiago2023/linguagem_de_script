     <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

<body>

    <h2>Cadastro de Produto - Farmácia</h2>

    Nome:
    <input type="text" id="nome"><br>

    Fabricante:
    <input type="text" id="fabricante"><br>

    Categoria:
    <select id="categoria">
        <option value="Medicamento">Medicamento</option>
        <option value="Higiene">Higiene</option>
        <option value="Cosmético">Cosmético</option>
    </select>
    <br>

    Preço:
    <input type="number" id="preco"><br>

    Quantidade:
    <input type="number" id="quantidade"><br>

    <button onclick="cadastrar()">
        Salvar
    </button>

    <div id="listaProdutos"></div>

    <script>

        let produtos = [];

        function cadastrar(){

            let nome = document.getElementById("nome").value;
            let fabricante = document.getElementById("fabricante").value;
            let categoria = document.getElementById("categoria").value;
            let preco = document.getElementById("preco").value;
            let quantidade = document.getElementById("quantidade").value;

            if(nome == "" || fabricante == "" || preco == "" || quantidade == ""){
                alert("Preencha todos os campos!");
                return;
            }

            let produto = {
                nome: nome,
                fabricante: fabricante,
                categoria: categoria,
                preco: preco,
                quantidade: quantidade
            };

            produtos.push(produto);

            mostrarProdutos();

            limparCampos();

            alert("Produto cadastrado com sucesso!");
        }

        function mostrarProdutos(){

            let lista = document.getElementById("listaProdutos");

            lista.innerHTML = "<h3>Produtos Cadastrados</h3>";

            produtos.forEach(function(produto){

                lista.innerHTML += `
                    <div class="produto">
                        <p><strong>Nome:</strong> ${produto.nome}</p>
                        <p><strong>Fabricante:</strong> ${produto.fabricante}</p>
                        <p><strong>Categoria:</strong> ${produto.categoria}</p>
                        <p><strong>Preço:</strong> R$ ${produto.preco}</p>
                        <p><strong>Quantidade:</strong> ${produto.quantidade}</p>
                    </div>
                `;
            });
        }

        function limparCampos(){
            document.getElementById("nome").value = "";
            document.getElementById("fabricante").value = "";
            document.getElementById("preco").value = "";
            document.getElementById("quantidade").value = "";
        }

    </script>

</body>

<!DOCTYPE html>
<html>
<body>

<input type="text" id="nome" placeholder="Digite seu nome">
<button onclick="salvar()">Salvar</button>

<h2 id="mostrar"></h2>

<script>
function salvar() {
    let nome = document.getElementById("nome").value;

    localStorage.setItem("nome", nome);

    document.getElementById("mostrar").innerHTML = nome;
}
</script>

</body>
</html>
