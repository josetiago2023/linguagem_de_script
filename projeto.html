<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sistema de farmácia</h1>
    <section>
        <h2>cadastro de produto</h2>
<input id="nome" placeholder="Nome">
<input id = "fabricante" placeholder="Fabricante">

<select id = "categoria">
    <option value="">Medicamento</option>
    <option value="">Higiene</option>
    <option value="">Cosmético</option>
</select>

<input id="preco" type="number" placeholder="Preço">
<input id = "estoque" type="number" placeholder="Quantidade">

<button onclick="cadastrarProduto()">
    Cadastrar Produto
</button>
</section>

<section>
    <h2>Produtos</h2>
    <div id="listaProdutos"></div>
</section>

<section>
<h2>Cadastro de Cliente</h2>

<input id="clienteNome" placeholder="Nome do Cliente">

<button onclick="cadastrarCliente()">
Cadastrar Cliente
</button>

<div id="listaClientes"></div>
</section>

<section>
<h2>Venda</h2>

<select id="produtoVenda"></select>

<input id="quantidadeVenda"
type="number"
placeholder="Quantidade">

<button onclick="vender()">
Realizar Venda
</button>

<h3 id="totalVendas">
Total vendido: R$ 0
</h3>
</section>


    <script>


let produtos =
JSON.parse(localStorage.getItem("produtos")) || [];

let clientes =
JSON.parse(localStorage.getItem("clientes")) || [];

let vendas =
JSON.parse(localStorage.getItem("vendas")) || [];

function salvar(){
    localStorage.setItem(
        "produtos",
        JSON.stringify(produtos)
    );

    localStorage.setItem(
        "clientes",
        JSON.stringify(clientes)
    );

    localStorage.setItem(
        "vendas",
        JSON.stringify(vendas)
    );
}

function cadastrarProduto(){

    let produto = {
        id: Date.now(),
        nome: document.getElementById("nome").value,
        fabricante: document.getElementById("fabricante").value,
        categoria: document.getElementById("categoria").value,
        preco: Number(
            document.getElementById("preco").value
        ),
        estoque: Number(
            document.getElementById("estoque").value
        )
    };

    produtos.push(produto);

    salvar();
    atualizarTela();

    alert("Produto cadastrado!");
}

function cadastrarCliente(){

    let cliente = {
        id: Date.now(),
        nome: document.getElementById("clienteNome").value,
        pontos: 0
    };

    clientes.push(cliente);

    salvar();
    atualizarTela();

    alert("Cliente cadastrado!");
}

function vender(){

    let indice =
    document.getElementById("produtoVenda").value;

    let quantidade =
    Number(
    document.getElementById("quantidadeVenda").value
    );

    let produto = produtos[indice];

    if(quantidade > produto.estoque){
        alert("Estoque insuficiente!");
        return;
    }

    produto.estoque -= quantidade;

    let total =
    produto.preco * quantidade;

    vendas.push({
        produto: produto.nome,
        quantidade: quantidade,
        total: total
    });

    salvar();
    atualizarTela();

    alert(
        "Venda realizada! Total R$ "
        + total.toFixed(2)
    );
}

    </script>
</body>
</html>
